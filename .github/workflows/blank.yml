Publication Record

The project was published in DOMES, May 2002, pages 16–23. The surviving digital document used for this page includes the magazine cover and the project pages, preserving the publication context.
About the Architect

Xenofon Stefanidis is an architect engineer whose work includes corporate, commercial and specialised buildings. The Delta-Singular Headquarters is documented here as part of his architectural portfolio, based on the original architectural publication.

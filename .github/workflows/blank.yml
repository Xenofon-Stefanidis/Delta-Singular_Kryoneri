The Project

The Delta-Singular building in Kryoneri, Attica, was conceived as a specialised corporate facility for a major Greek information-technology company. The published project describes spaces and infrastructure for high-intensity information processing and telecommunications, including a call-centre, computer-room facilities, offices and supporting staff amenities.

The architectural approach combines a strong contemporary corporate identity with the functional requirements of a technologically demanding workplace. The published description emphasises the relationship between the building's form, its structural system and the technical infrastructure required for its operation.
